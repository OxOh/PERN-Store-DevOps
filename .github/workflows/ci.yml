name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/repo \
            zricethezav/gitleaks:v8.24.0@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176 detect --source /repo --redact --no-banner

  server:
    name: Server - lint, audit and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pernstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts && npm rebuild bcrypt
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Load schema
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d pernstore_test -f config/init.sql
        env:
          PGPASSWORD: postgres
      - name: Create env file from example
        run: cp .env.example .env
      - name: Run tests
        run: npm test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB_TEST: pernstore_test
          SECRET: ci-test-secret
          REFRESH_SECRET: ci-test-refresh-secret

  client:
    name: Client - lint, audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /api

  docker:
    name: Docker - build and scan images
    runs-on: ubuntu-latest
    needs: [secrets, server, client]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: docker build -t pern-store-server ./server
      - run: >
          docker build -t pern-store-client
          --build-arg VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          --build-arg VITE_STRIPE_PUB_KEY=${{ vars.VITE_STRIPE_PUB_KEY }}
          --build-arg VITE_PAYSTACK_PUB_KEY=${{ vars.VITE_PAYSTACK_PUB_KEY }}
          ./client
      - name: Trivy report (HIGH and CRITICAL)
        run: |
          for img in pern-store-server pern-store-client; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy":/root/.cache/ \
              aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --severity HIGH,CRITICAL --ignore-unfixed \
              --no-progress --exit-code 0 "$img"
          done
      - name: Trivy gate (fail on fixable CRITICAL)
        run: |
          for img in pern-store-server pern-store-client; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy":/root/.cache/ \
              aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --severity CRITICAL --ignore-unfixed \
              --no-progress --exit-code 1 "$img"
          done
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Push scanned images to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          registry="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          for svc in server client; do
            docker tag "pern-store-$svc" "$registry/pern-store-$svc:$GITHUB_SHA"
            docker push "$registry/pern-store-$svc:$GITHUB_SHA"
          done

  sonar:
    name: SonarQube Cloud - static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy - ECS Fargate
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Register new task definitions and roll out
        run: |
          registry="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          for svc in server client; do
            image="$registry/pern-store-$svc:$GITHUB_SHA"
            aws ecs describe-task-definition --task-definition "pern-store-$svc" --query taskDefinition \
              | jq --arg repo "$registry/pern-store-$svc:" --arg img "$image" '
                  .containerDefinitions |= map(if (.image | startswith($repo)) then .image = $img else . end)
                  | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                        .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
              > "td-$svc.json"
            arn=$(aws ecs register-task-definition --cli-input-json "file://td-$svc.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "$svc -> $arn"
            echo "$arn" > "arn-$svc.txt"
            aws ecs update-service --cluster pern-store --service "pern-store-$svc" \
              --task-definition "$arn" --query 'service.serviceName' --output text
          done
      - name: Wait for rollout and verify no rollback
        run: |
          aws ecs wait services-stable --cluster pern-store --services pern-store-server pern-store-client
          for svc in server client; do
            want=$(cat "arn-$svc.txt")
            got=$(aws ecs describe-services --cluster pern-store --services "pern-store-$svc" \
              --query 'services[0].taskDefinition' --output text)
            if [ "$got" != "$want" ]; then
              echo "::error::$svc rolled back: running $got, expected $want"
              exit 1
            fi
            echo "$svc is running $got"
          done
