name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server - lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pernstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Load schema
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d pernstore_test -f config/init.sql
        env:
          PGPASSWORD: postgres
      - name: Create env file from example
        run: cp .env.example .env
      - name: Run tests
        run: npm test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB_TEST: pernstore_test
          SECRET: ci-test-secret
          REFRESH_SECRET: ci-test-refresh-secret

  client:
    name: Client - lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /api

  docker:
    name: Docker - build and scan images
    runs-on: ubuntu-latest
    needs: [secrets, server, client]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pern-store-server ./server
      - run: docker build -t pern-store-client ./client
      - name: Trivy report (HIGH and CRITICAL)
        run: |
          for img in pern-store-server pern-store-client; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy":/root/.cache/ \
              aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --ignore-unfixed \
              --no-progress --exit-code 0 "$img"
          done
      - name: Trivy gate (fail on fixable CRITICAL)
        run: |
          for img in pern-store-server pern-store-client; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy":/root/.cache/ \
              aquasec/trivy:0.58.1 image --severity CRITICAL --ignore-unfixed \
              --no-progress --exit-code 1 "$img"
          done
