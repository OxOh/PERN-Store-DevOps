services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    env_file: ./server/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  server:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - frontend

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_STRIPE_PUB_KEY: ${VITE_STRIPE_PUB_KEY}
        VITE_PAYSTACK_PUB_KEY: ${VITE_PAYSTACK_PUB_KEY}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - server
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
